<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="main.css" />
</head>

<body>
    <h1>
        <img id="icone-titulo" src="https://emojigraph.org/media/openmoji/memo_1f4dd.png" alt="Lapis e papel"/>
        Lista de Tarefas
    </h1>

    <form id="form-tarefa">
        <input type="text" id="input-tarefa" placeholder="Digite uma nova tarefa" required />
        <button type="submit">Adicionar</button>
    </form>

    <ol id="lista-tarefas"></ol>

    <button id="btn-limpar-tudo">Limpar Todas</button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
